name: Load test (k6)

# HTTP load test of mod_sideline (P-39). Manual only: it builds a fresh Moodle, seeds a course with
# learners, serves it with PHP's built-in server (several workers) and runs tests/load/sideline-commentary.js:
# a plateau of logged-in learners requesting the commentary through lib/ajax/service.php, with state
# changes in between, and a race of many sessions of one learner. verify_load.php then checks the
# cache on the server side. Budgets: see tests/load/README.md.
on:
  workflow_dispatch:
    inputs:
      moodle:
        description: Moodle branch
        type: choice
        options: [MOODLE_503_STABLE, MOODLE_502_STABLE, MOODLE_501_STABLE, MOODLE_500_STABLE, MOODLE_405_STABLE]
        default: MOODLE_503_STABLE
      vus:
        description: Concurrent learners in the plateau
        default: '20'
      duration:
        description: Plateau duration in seconds
        default: '60'
      users:
        description: Seeded learners
        default: '50'

jobs:
  k6:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      WWWROOT: http://127.0.0.1:8000

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif, sodium
          ini-values: max_input_vars=5000
          tools: composer

      - name: Install Moodle with the plugin and seed the load course
        id: seed
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.moodle }}" https://github.com/moodle/moodle.git moodle
          # Moodle 5.1 and later keep the web root and the plugins below public/.
          if [ -f moodle/public/version.php ]; then web=moodle/public; else web=moodle; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          cp -a plugin "$web/mod/sideline"
          rm -rf "$web/mod/sideline/.git"
          (cd moodle && composer install --no-dev --no-interaction --quiet)
          mkdir -p /tmp/moodledata
          php "$web/admin/cli/install.php" \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle --dbuser=moodle --dbpass=moodle \
            --wwwroot="$WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="Sideline load" --shortname="load" \
            --adminpass="Admin!23" --adminemail=ci@example.invalid
          php "$web/mod/sideline/tests/load/seed_load.php" --users="${{ github.event.inputs.users }}" --activities=20 \
            | tee /tmp/seed.env
          sed -n "s/^export \([A-Z_]*\)='\(.*\)'$/\L\1\E=\2/p" /tmp/seed.env >> "$GITHUB_OUTPUT"

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run the load test and check the server state
        run: |
          web='${{ steps.seed.outputs.web }}'
          # Started in THIS step, bound to 127.0.0.1 (localhost may resolve to ::1, where the server
          # does not listen), with several workers so that parallel requests do not serialise.
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t "$web" > /tmp/moodle-server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$WWWROOT/login/index.php" || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "The test server did not come up (last HTTP status: $code)."
            tail -50 /tmp/moodle-server.log
            exit 1
          fi
          k6 run \
            -e BASE_URL='${{ steps.seed.outputs.base_url }}' \
            -e CMID='${{ steps.seed.outputs.cmid }}' \
            -e USER_PREFIX='${{ steps.seed.outputs.user_prefix }}' \
            -e USERS='${{ steps.seed.outputs.users }}' \
            -e PASSWORD='${{ steps.seed.outputs.password }}' \
            -e PAGE_CMIDS='${{ steps.seed.outputs.page_cmids }}' \
            -e VUS='${{ github.event.inputs.vus }}' \
            -e DURATION='${{ github.event.inputs.duration }}s' \
            --summary-export=k6-summary.json \
            plugin/tests/load/sideline-commentary.js
          php "$web/mod/sideline/tests/load/verify_load.php" \
            --cmid='${{ steps.seed.outputs.cmid }}' --prefix='${{ steps.seed.outputs.user_prefix }}'

      - name: Show the server log on failure
        if: failure()
        run: tail -100 /tmp/moodle-server.log || true

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6-summary.json
          retention-days: 14
          if-no-files-found: ignore
