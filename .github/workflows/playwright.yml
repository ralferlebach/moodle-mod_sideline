name: Browser journeys (Playwright)

# Browser journeys of mod_sideline in Chromium: consent, commentary, interview by keyboard, reduced
# motion, accessibility (axe) and the absence of a teacher view (tests/playwright/README.md).
# Manual only, there is no schedule: it builds a fresh Moodle with the plugin, seeds a course with
# tests/playwright/seed.php, serves it with PHP's built-in server and runs the suite against it.
# Moodle 5.3 renders the React panel, 4.5 to 5.2 the AMD panel; the suite covers both.
on:
  workflow_dispatch:
    inputs:
      moodle:
        description: Moodle branch
        type: choice
        options: [MOODLE_503_STABLE, MOODLE_502_STABLE, MOODLE_501_STABLE, MOODLE_500_STABLE, MOODLE_405_STABLE]
        default: MOODLE_503_STABLE

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      WWWROOT: http://127.0.0.1:8000

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif, sodium
          ini-values: max_input_vars=5000
          tools: composer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/tests/playwright/package-lock.json

      - name: Install Moodle with the plugin and seed the test course
        id: seed
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.moodle }}" https://github.com/moodle/moodle.git moodle
          # Moodle 5.1 and later keep the web root and the plugins below public/.
          if [ -f moodle/public/version.php ]; then web=moodle/public; else web=moodle; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          cp -a plugin "$web/mod/sideline"
          rm -rf "$web/mod/sideline/.git"
          (cd moodle && composer install --no-dev --no-interaction --quiet)
          mkdir -p /tmp/moodledata
          php "$web/admin/cli/install.php" \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle --dbuser=moodle --dbpass=moodle \
            --wwwroot="$WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="Sideline browser" --shortname="browser" \
            --adminpass="Admin!23" --adminemail=ci@example.invalid
          php "$web/mod/sideline/tests/playwright/seed.php" > /tmp/seed.out
          grep '^export ' /tmp/seed.out | tee /tmp/seed.env
          # Hand the values to the test step as environment variables.
          sed -n "s/^export \(SL_[A-Z0-9_]*\)='\(.*\)'$/\1=\2/p" /tmp/seed.env >> "$GITHUB_ENV"

      - name: Install Playwright and Chromium
        working-directory: plugin/tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser journeys
        env:
          CI: '1'
        run: |
          web='${{ steps.seed.outputs.web }}'
          # Started in THIS step, bound to 127.0.0.1 (localhost may resolve to ::1, where the server
          # does not listen), with several workers so that the page and its AJAX calls do not serialise.
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t "$web" > /tmp/moodle-server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$WWWROOT/login/index.php" || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "The test server did not come up (last HTTP status: $code)."
            tail -50 /tmp/moodle-server.log
            exit 1
          fi
          cd plugin/tests/playwright
          npx playwright test

      - name: Show the server log on failure
        if: failure()
        run: tail -100 /tmp/moodle-server.log || true

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.moodle }}
          path: |
            plugin/tests/playwright/playwright-report
            plugin/tests/playwright/test-results
          retention-days: 14
          if-no-files-found: ignore
