##############################################################################
# Moodle Plugin CI - main (release) pipeline - mod_sideline
#
# Runs ONLY on push / PR to main; provides the "CI complete" status check for
# branch protection. Full SEQUENTIAL pipeline per matrix cell across the
# supported Moodle 4.5 to 5.3 x PHP 8.2+ x DB matrix (no PHP 8.1 or older anywhere, issue #1).
# Every cell runs the plugin and adapter PHPUnit suites (skipped tests fail the run), Behat and
# the real concurrency races of tools/race. grunt lints amd/src and checks that the committed AMD
# build is current. The frontend job runs ESLint, the strict TypeScript check, the ESM build and
# Jest with axe for both panels on Moodle 5.3; the upgrade job upgrades from the previous release and from 0.3.2.
# There is no release gate and no version lockstep (issue #2): "CI complete" only aggregates the
# results of the functional jobs. The fast parallel pipeline lives in moodle-plugin-ci-dev.yml.
##############################################################################

name: Moodle Plugin CI Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "CI / ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.2', database: pgsql }
          - { moodle: MOODLE_405_STABLE, php: '8.3', database: mariadb }
          - { moodle: MOODLE_500_STABLE, php: '8.2', database: pgsql }
          - { moodle: MOODLE_500_STABLE, php: '8.3', database: mariadb }
          - { moodle: MOODLE_501_STABLE, php: '8.3', database: pgsql }
          - { moodle: MOODLE_502_STABLE, php: '8.3', database: mariadb }
          - { moodle: MOODLE_503_STABLE, php: '8.3', database: pgsql }
          - { moodle: MOODLE_503_STABLE, php: '8.3', database: mariadb }
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle, dependencies and plugin
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint 2>&1 | tee ci-logs/phplint.log
      - name: PHP Copy/Paste Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpcpd 2>&1 | tee ci-logs/phpcpd.log
      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpmd 2>&1 | tee ci-logs/phpmd.log
      - name: Moodle Code Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci codechecker --max-warnings 0 --exclude=PSR1.Classes.ClassDeclaration,moodle.Commenting.TodoComment 2>&1 | tee ci-logs/codechecker.log
      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpdoc --max-warnings 0 2>&1 | tee ci-logs/phpdoc.log
      - name: Validating
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci validate 2>&1 | tee ci-logs/validate.log
      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci savepoints 2>&1 | tee ci-logs/savepoints.log
      - name: Grunt (ESLint, AMD build up to date, stylelint, gherkin)
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci grunt --max-lint-warnings 0 2>&1 | tee ci-logs/grunt.log
      - name: PHPUnit tests
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpunit --fail-on-warning --fail-on-skipped --fail-on-incomplete --testdox 2>&1 | tee ci-logs/phpunit.log
      - name: PHPUnit tests of the adapters (slcmod_assign, slcmod_quiz)
        if: ${{ always() }}
        run: |
          set -o pipefail
          for suite in slcmod_assign_testsuite slcmod_quiz_testsuite; do
            moodle-plugin-ci phpunit --fail-on-warning --fail-on-skipped --fail-on-incomplete --testdox --testsuite $suite 2>&1 | tee -a ci-logs/phpunit-adapters.log
          done
      - name: Concurrency races (real parallel processes, issues 3 and 8)
        if: ${{ always() }}
        run: |
          set -o pipefail
          # The races need a site of their own: the main tables, next to the PHPUnit and Behat ones.
          php moodle/admin/cli/install_database.php --agree-license --adminpass=Admin1! --adminemail=admin@example.com --fullname=CI --shortname=CI > ci-logs/race-install.log 2>&1
          php moodle/$(test -d moodle/public && echo public/)mod/sideline/tools/race/run.php 2>&1 | tee ci-logs/race.log
      - name: Behat features
        id: behat
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci behat --profile chrome --tags "@mod_sideline&&~@broken" --dump 2>&1 | tee ci-logs/behat.log
      - name: Collect error summary
        if: ${{ always() }}
        run: |
          if [ -d "$GITHUB_WORKSPACE/moodledata/behat_dump" ]; then
            mkdir -p ci-logs/behat_dump
            cp -a "$GITHUB_WORKSPACE/moodledata/behat_dump/." ci-logs/behat_dump/
          fi
          {
            echo "job: ${{ github.job }} (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }})"
            echo "status: ${{ job.status }}"
            echo "ref:    ${{ github.ref }}"
            echo ""
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt
      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-main-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.database }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Behat screenshots (ZIP)
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: behat-screenshots-main-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: warn


  release-artefact:
    name: Release artefact contents
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Build the release archive exactly as it will be distributed
        run: |
          # git archive is what honours .gitattributes export-ignore. Building the artefact here
          # means the gate tests the file set that is actually shipped, not the working tree.
          git archive --format=tar --prefix=sideline/ HEAD > /tmp/release.tar
          tar -tf /tmp/release.tar > /tmp/release.list
          echo "Artefakt enthält $(wc -l < /tmp/release.list) Einträge."

      - name: No developer tooling, CI plumbing or test harnesses may ship
        run: |
          rc=0
          while read -r forbidden; do
            if grep -qE "^sideline/${forbidden}" /tmp/release.list; then
              echo "VERBOTEN im Release-Artefakt: $forbidden"
              grep -E "^sideline/${forbidden}" /tmp/release.list | head -5
              rc=1
            fi
          done <<'PATTERNS'
          tools/
          docs/
          \.github/
          tests/load/
          tests/playwright/
          \.gitattributes
          \.gitignore
          makefile
          phpcs\.xml
          PATTERNS
          if [[ $rc -ne 0 ]]; then
            echo "Das Release-Artefakt darf keine Entwicklerwerkzeuge enthalten."
            exit 1
          fi
          echo "Artefakt ist sauber."

      - name: The artefact must still contain what Moodle runs
        run: |
          for required in sideline/version.php sideline/lang sideline/db sideline/db/removed_files.txt sideline/cli/privacy_check.php; do
            if ! grep -q "^${required}" /tmp/release.list; then
              echo "FEHLT im Release-Artefakt: $required"
              exit 1
            fi
          done
          echo "Pflichtinhalte vorhanden."

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres@sha256:6efd0df010dc3cb40d5e33e3ef84acecc5e73161bd3df06029ee8698e5e12c60
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP with a coverage driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, zip, gd, xmlrpc, soap, intl
          # pcov is enough for line coverage and far faster than xdebug.
          coverage: pcov
          ini-values: max_input_vars=5000

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist             moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and the plugin
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Run PHPUnit with coverage
        run: |
          # Clover XML instead of --coverage-text: the text report covers the whole Moodle tree
          # (its summary showed ~2% because it counts all of core), which says nothing about this
          # plugin. Clover gives per-file counters, so the gate can measure exactly this plugin.
          moodle-plugin-ci phpunit --coverage-clover --coverage-pcov ./plugin
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Enforce the coverage floor for this plugin
        run: |
          report=$(find . -name 'coverage.xml' -o -name 'clover.xml' | head -1)
          if [[ -z "$report" ]]; then
            echo "Kein Clover-Report gefunden - das Gate kann nicht bewertet werden."
            exit 1
          fi
          echo "Report: $report"
          # The gate measures THIS plugin only. Counting every path containing 'sideline' would
          # also include the three sibling plugins that are installed alongside but whose tests do
          # not run here - that produced a meaningless 0.5% and made the gate useless.
          php plugin/tools/coverage_gate.php "$report" "$COVERAGE_FLOOR"
        env:
          COVERAGE_FLOOR: '80'


  stale-files:
    name: Stale files
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Files removed in earlier releases must not still be present
        run: |
          # Unpacking a plugin ZIP adds and overwrites files but never deletes any, so a file
          # removed upstream survives in an installed copy or in a repository updated that way.
          # It then still autoloads, duplicates a class, or reads columns that no longer exist.
          # This job turns that into a loud failure instead of confusing downstream errors.
          list=db/removed_files.txt
          if [[ ! -f "$list" ]]; then
            echo "Keine Liste entfernter Dateien vorhanden - nichts zu pruefen."
            exit 0
          fi
          rc=0
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ -e "$path" ]]; then
              echo "Veraltete Datei ist noch vorhanden: $path"
              rc=1
            fi
          done < "$list"
          if [[ $rc -ne 0 ]]; then
            echo "Diese Dateien wurden in frueheren Releases entfernt und muessen geloescht werden."
            exit 1
          fi
          echo "Keine veralteten Dateien gefunden."

  frontend:
    name: Frontend (ESLint, TypeScript strict, ESM/AMD build, Jest with axe)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle 5.3 with its node_modules and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_503_STABLE
      - name: Node version of Moodle
        uses: actions/setup-node@v4
        with:
          node-version-file: moodle/.nvmrc
      - name: Frontend checks
        run: |
          set -o pipefail
          mkdir -p ci-logs
          SRC=$GITHUB_WORKSPACE/plugin MPCI=$RUNNER_TEMP/mpci bash plugin/tools/ci-local/js-checks.sh $GITHUB_WORKSPACE/moodle 2>&1 | tee ci-logs/frontend.log
      - name: Upload frontend log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-log
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  upgrade:
    name: "Upgrade from ${{ matrix.from }} / ${{ matrix.moodle }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        # "previous": the last commit with a different release string. "0.4.1": the release whose application
        # cache held user ids; its cells first copy the current code over the old directory, as happened on
        # GitHub with 0.4.2 (#31): the upgrade must stop and name db/caches.php, and succeed once the directory
        # is replaced. "0.4.0": the release before the first cache definition, with the same version number as
        # 0.4.1. "0.3.2": the last release before the schema changes of 0.4.0, so that every upgrade step runs
        # on real data at least once. Each starting point on both Moodle versions and both databases.
        include:
          - { from: previous, moodle: MOODLE_405_STABLE, php: '8.3', database: pgsql }
          - { from: previous, moodle: MOODLE_503_STABLE, php: '8.3', database: mariadb }
          - { from: '0.4.1', moodle: MOODLE_405_STABLE, php: '8.3', database: mariadb, copyover: true }
          - { from: '0.4.1', moodle: MOODLE_503_STABLE, php: '8.3', database: pgsql, copyover: true }
          - { from: '0.4.0', moodle: MOODLE_405_STABLE, php: '8.3', database: mariadb }
          - { from: '0.4.0', moodle: MOODLE_503_STABLE, php: '8.3', database: pgsql }
          - { from: '0.3.2', moodle: MOODLE_405_STABLE, php: '8.3', database: pgsql }
          - { from: '0.3.2', moodle: MOODLE_503_STABLE, php: '8.3', database: mariadb }
    steps:
      - name: Check out repository code with history
        uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 0
      - name: The release to upgrade from
        env:
          FROM: ${{ matrix.from }}
        run: |
          cd current
          field() { git show "$1:version.php" 2>/dev/null | grep -oE "\\\$plugin->release *= *'[^']+'" | grep -oE "[^']+'$" | tr -d "'"; }
          now=$(field HEAD)
          prev=""
          for c in $(git log --format=%H -- version.php); do
            release=$(field "$c")
            if [[ "$FROM" == "previous" && "$release" != "$now" ]] || [[ "$release" == "$FROM" ]]; then
              prev=$c
              break
            fi
          done
          if [[ -z "$prev" ]]; then echo "Release $FROM not found in the history."; exit 1; fi
          echo "Upgrading from $(field "$prev") ($prev) to $now"
          git worktree add ../previous "$prev"
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle with the previous release
        run: moodle-plugin-ci install --plugin ./previous --db-host=127.0.0.1 --no-init
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: Install the site, seed data, replace the plugin by the current code and upgrade
        run: |
          set -o pipefail
          root=moodle; [[ -d moodle/public ]] && root=moodle/public
          php moodle/admin/cli/install_database.php --agree-license --adminpass=Admin1! --adminemail=admin@example.com --fullname=CI --shortname=CI
          # Data of the old release, written with its own code (the seed script comes from the current code).
          cp current/tools/ci/upgrade_seed.php "$root/mod/sideline/upgrade_seed.php"
          php "$root/mod/sideline/upgrade_seed.php" 2>&1 | tee upgrade-seed.log
          if [[ "${{ matrix.copyover }}" == "true" ]]; then
            # The current code copied over the old directory: a file that the release removed stays behind.
            # --checksum: rsync would otherwise skip a file of the same size and modification second, such as
            # version.php of 0.4.1, checked out in the same second as the current code (#31, run 115988086541).
            rsync -a --checksum --exclude=.git current/ "$root/mod/sideline/"
            cmp -s current/version.php "$root/mod/sideline/version.php" \
              || { echo "FAIL the current version.php was not copied"; exit 1; }
            if php moodle/admin/cli/upgrade.php --non-interactive > upgrade-copyover.log 2>&1; then
              echo "FAIL the upgrade ran although db/caches.php of the old release is still there"; exit 1
            fi
            grep -q "removed are still in its directory: db/caches.php" upgrade-copyover.log \
              || { tail -30 upgrade-copyover.log; echo "FAIL the upgrade did not name the removed file"; exit 1; }
            echo "PASS the upgrade stops and names db/caches.php while it is still in the directory"
          fi
          # The full code base replaces the old one, as an administrator does it.
          rm -rf "$root/mod/sideline"
          rsync -a --exclude=.git current/ "$root/mod/sideline/"
          php moodle/admin/cli/upgrade.php --non-interactive 2>&1 | tee upgrade.log
          php moodle/admin/cli/check_database_schema.php 2>&1 | tee upgrade-schema.log
          php "$root/mod/sideline/tools/ci/upgrade_verify.php" 2>&1 | tee upgrade-verify.log
      - name: Upload upgrade logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-${{ matrix.from }}-${{ matrix.moodle }}-${{ matrix.database }}
          path: |
            upgrade-seed.log
            upgrade-copyover.log
            upgrade.log
            upgrade-schema.log
            upgrade-verify.log
          retention-days: 7
          if-no-files-found: ignore

  ci-complete:
    name: CI complete
    needs: [test, frontend, upgrade, release-artefact, coverage, stale-files]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Every functional job must have succeeded
        run: |
          # Plain aggregation of the functional jobs for branch protection: no maturity, sign-off,
          # version lockstep or other release formality takes part (issue #2).
          rc=0
          for entry in \
            "test=${{ needs.test.result }}" \
            "frontend=${{ needs.frontend.result }}" \
            "upgrade=${{ needs.upgrade.result }}" \
            "release-artefact=${{ needs.release-artefact.result }}" \
            "coverage=${{ needs.coverage.result }}" \
            "stale-files=${{ needs.stale-files.result }}"; do
            echo "  ${entry%%=*}: ${entry#*=}"
            if [[ "${entry#*=}" != "success" ]]; then
              rc=1
            fi
          done
          if [[ $rc -ne 0 ]]; then
            echo "Mindestens ein Testjob ist nicht gruen (siehe Liste oben)."
            exit 1
          fi
          echo "All functional jobs passed."
